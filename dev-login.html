<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PRAÇA CONECTA — Acesso Restrito</title>

  <!-- Tela de senha do painel dev. O painel completo (dev.html) só é entregue
       pelo servidor depois do login, com o cookie de sessão. -->
  <script src="/assets/tailwindcss-3.4.17.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            studio: { bg: '#0F131C', surface: '#151B27', card: '#1B2333', border: '#242F45' },
            sakura: { 300: '#FDA4AF', 400: '#FB7185', 500: '#F43F5E', 600: '#E11D48', 700: '#BE123C' }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  </style>
</head>

<body class="bg-studio-bg text-slate-100 font-sans min-h-screen">

  <div id="auth-modal" class="fixed inset-0 z-50 bg-[#0B0E14]/95 backdrop-blur-2xl flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-studio-surface border border-studio-border rounded-xl p-6 sm:p-8 shadow-2xl relative text-center">
      <div class="w-16 h-16 rounded-xl bg-sakura-500/20 text-sakura-400 border border-sakura-500/30 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-sakura-600/20">
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="text-xl sm:text-2xl font-black text-white mb-1.5">Acesso Restrito</h1>
      <p class="text-xs text-slate-400 leading-relaxed mb-6">Digite a senha administrativa para continuar.</p>

      <form id="form-auth" class="space-y-4">
        <div>
          <label for="input-dev-pass" class="text-xs font-mono text-slate-300 block text-left mb-1.5">Senha:</label>
          <div class="relative">
            <input id="input-dev-pass" type="password" required autocomplete="current-password" autofocus placeholder="Digite sua senha..." class="w-full bg-studio-card border border-studio-border rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sakura-500 font-mono tracking-wider" />
            <button type="button" id="btn-toggle-pass-visibility" class="absolute right-3 top-3.5 text-slate-400 hover:text-white transition-colors" title="Ver/Ocultar Senha">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div id="auth-error-msg" class="text-xs text-rose-400 font-mono hidden bg-rose-500/10 border border-rose-500/20 rounded-xl p-2.5"></div>

        <button type="submit" id="btn-submit-auth" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-sakura-600 to-sakura-700 hover:from-sakura-500 hover:to-sakura-600 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-sakura-600/30 transition-all">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
          </svg>
          <span>Entrar</span>
        </button>
      </form>

      <div class="mt-5 text-[11px] font-mono text-slate-500">Praça Conecta</div>
    </div>
  </div>

  <script>
    // Senha passada no link (?token= ou ?pass=), como o painel já aceitava:
    // usada só para o login e tirada da barra de endereço/histórico.
    const params = new URLSearchParams(window.location.search);
    const urlPassword = params.get('token') || params.get('pass');
    if (urlPassword) {
      params.delete('token');
      params.delete('pass');
      const rest = params.toString();
      history.replaceState(null, '', window.location.pathname + (rest ? `?${rest}` : '') + window.location.hash);
    }

    const form = document.getElementById('form-auth');
    const input = document.getElementById('input-dev-pass');
    const errEl = document.getElementById('auth-error-msg');
    const btn = document.getElementById('btn-submit-auth');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    async function login(pass) {
      errEl.classList.add('hidden');
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success && data.token) {
          // O servidor já gravou o cookie que libera a página. O painel usa o
          // token desta aba para os comandos (cabeçalho Authorization).
          sessionStorage.removeItem('dev_auth_token');
          sessionStorage.setItem('dev_session', data.token);
          window.location.reload();
          return;
        }
        showError(data.error || 'Senha incorreta.');
      } catch (err) {
        showError('Servidor inacessível ou reiniciando. Tente novamente.');
      } finally {
        btn.disabled = false;
      }
      input.value = '';
      input.focus();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = input.value.trim();
      if (!pass) { showError('Digite a senha.'); return; }
      login(pass);
    });

    document.getElementById('btn-toggle-pass-visibility').addEventListener('click', () => {
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    if (urlPassword) login(urlPassword);
  </script>
</body>
</html>
